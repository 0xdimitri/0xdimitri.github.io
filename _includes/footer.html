<!-- _includes/footer.html -->
<footer aria-label="Site Info"
  class="d-flex flex-column justify-content-center align-items-center text-muted flex-lg-row justify-content-lg-between op-6 pt-4 pb-4 font-weight-light">
  <div class="footer-left">
    <p class="mb-0">
      © {{ 'now' | date: '%Y' }}
      <a href="{{ site.social.links[0] }}">{{ site.author }}</a>.
      {% if site.data.locales[include.lang].copyright.brief %}
        <span
          data-bs-toggle="tooltip"
          data-bs-placement="top"
          title="{{ site.data.locales[include.lang].copyright.verbose }}"
        >
          {{ site.data.locales[include.lang].copyright.brief }}
        </span>
      {% endif %}
    </p>
  </div>

  <!-- Theme Credit Removed/Commented Out -->

  <div class="footer-right">

    </p>
  </div>
  -->
</footer>
